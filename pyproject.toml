[project]
    authors = [{ name = "Nate Landau", email = "github@natenate.org" }]
    classifiers = [
        "Environment :: Console",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: Multimedia :: Video :: Conversion",
    ]
    dependencies = [
        "cappa>=0.33.0,<1.0.0",
        "dynaconf>=3.3.5,<4.0.0",
        "ffmpeg-progress-yield>=1.1.4",
        "ffmpeg-python>=0.2.0",
        "httpx>=0.28.1",
        "iso639-lang>=2.6.3",
        "nclutils>=4.0.0,<5.0.0",
        "python-box>=7.4.1,<8.0.0",
        "rich>=15.0.0",
        "validators>=0.36.0",
    ]
    description = "Tools to transcode, inspect and convert videos."
    keywords = ["ffmpeg", "transcode", "video"]
    license = { file = "LICENSE" }
    name = "vid-cleaner"
    readme = "README.md"
    requires-python = ">=3.11"
    version = "0.14.0"

    [project.urls]
        Changelog  = "https://github.com/natelandau/vid-cleaner/blob/main/CHANGELOG.md"
        Homepage   = "https://github.com/natelandau/vid-cleaner"
        Issues     = "https://github.com/natelandau/vid-cleaner/issues"
        Repository = "https://github.com/natelandau/vid-cleaner"

    [project.scripts]
        vidcleaner = "vid_cleaner.vidcleaner:main"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.13.0,<0.14"]

[dependency-groups]
    dev = [
        "actionlint-py>=1.7.12.25",
        "commitizen>=4.19.3",
        "coverage>=7.17.0",
        "duty>=1.10.1",
        "gate-cache>=0.12.0",
        "prek>=0.5.9",
        "pytest-clarity>=1.0.1",
        "pytest-cov>=7.1.0",
        "pytest-devtools>=1.3.0",
        "pytest-mock>=3.17.0",
        "pytest-sugar>=1.1.1",
        "pytest>=9.2.0",
        "ruff>=0.17.3",
        "shellcheck-py>=0.11.0.1",
        "ty>=0.0.108",
        "typos>=1.51.1",
        "yamllint>=1.38.0",
        "zizmor>=1.33.1",
    ]

[tool.commitizen]
    bump_message               = "bump(release): v$current_version → v$new_version"
    changelog_merge_prerelease = true
    tag_format                 = "v$version"
    update_changelog_on_bump   = true
    version_files              = ["src/vid_cleaner/constants.py:VERSION"]
    version_provider           = "uv"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
    exclude_also = ['def __repr__', 'raise cappa\.Exit']
    fail_under   = 90
    precision    = 1
    show_missing = true
    skip_covered = true

[tool.coverage.run]
    branch    = true
    data_file = ".cache/coverage"
    source    = ["src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.ty.src] # https://docs.astral.sh/ty/reference/configuration/
    include = ["src", "tests"]

[tool.ty.rules] # Rules ty leaves off by default
    disjoint-cast                 = "error"
    missing-type-argument         = "error"
    possibly-unresolved-reference = "error"

[tool.ty.terminal]
    error-on-warning = true

[tool.pytest] # https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
    addopts        = ["--color=yes", "--doctest-modules", "--junitxml=.cache/pytest.xml"]
    cache_dir      = ".cache/pytest"
    filterwarnings = [
        "error",
        # cappa enters every parsed value that is a context manager, and on Python 3.11
        # and 3.12 a Path is one, so each Path-typed option warns. Python 3.13 removed it.
        'ignore:pathlib.Path.__enter__:DeprecationWarning',
    ]
    minversion     = "9.0"
    strict         = true
    testpaths      = ["src", "tests"]

[tool.ruff] # https://github.com/charliermarsh/ruff
    fix           = true
    line-length   = 100
    output-format = "grouped"
    src           = ["src", "tests"]

    [tool.ruff.lint]
        ignore = [
            "COM812", # Trailing comma missing; conflicts with the formatter
            "CPY001", # Missing copyright notice at top of file
            "E501",   # line-too-long; the formatter owns line length
            "FIX002", # Line contains TODO, consider resolving the issue
            "S311",   # suspicious-non-cryptographic-random-usage
            "TD002",  # Missing author in TODO
            "TD003",  # Missing issue link on the line following this TODO
        ]
        per-file-ignores = { "tests/**/*.py" = [
            "ANN001",
            "ANN003",
            "ANN201",
            "ANN202",
            "ARG001",
            "ARG005",
            "DOC201",
            "ERA001",
            "PLR0913",
            "PLR0917",
            "PLR2004",
            "S101",
        ] }
        select = ["ALL"]
        unfixable = [
            "ERA001", # Commented out code
            "F401",   # unused-import
            "F841",   # unused-variable
        ]
        [tool.ruff.lint.mccabe]
            max-complexity = 10

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-args = 6

    [tool.ruff.format]
        docstring-code-format = true
