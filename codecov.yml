---
coverage:
    status:
        project:
            default:
                target: 90% # matches fail_under in pyproject.toml
                threshold: 1% # the leniency in hitting the target
        patch:
            default:
                target: 50%
                threshold: 5%
    ignore:
        - tests/

comment:
    layout: "reach, diff, flags, files" # Remove items here to change the format
    require_changes: true
