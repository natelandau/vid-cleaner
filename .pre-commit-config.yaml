---
# https://pre-commit.com
default_install_hook_types: [commit-msg, pre-commit, pre-push]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: "https://github.com/commitizen-tools/commitizen"
    rev: ace110dad65751d559e9ffd239752f6f5e8f6f1e  # frozen: v4.20.0
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages:
          - pre-push

  - repo: "https://github.com/pre-commit/pygrep-hooks"
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # frozen: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
        exclude: ^tests/
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer

  - repo: "https://github.com/adrienverge/yamllint.git"
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        files: ^.*\.(yaml|yml)$
        entry: yamllint --strict --config-file .yamllint.yml

  - repo: "https://github.com/gitleaks/gitleaks"
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: "https://github.com/crate-ci/committed"
    rev: 02af07ed1d11ad69a96ab75f08c9831a4e2c00da  # frozen: v1.1.12
    hooks:
      - id: committed
        stages: [commit-msg]

  # mirrors-typos is a fork of typos that removes the v.1 mutable tag.
  # Commit messages only; the duty typos hook below checks files.
  - repo: "https://github.com/adhtruong/mirrors-typos"
    rev: 0c917027d64779efad4ad67fa85d47c666e33343  # frozen: v1.52.2
    hooks:
      - id: typos
        args: ["--force-exclude"]
        stages: [commit-msg]

  # Checks run through duty so they share gate-cache markers with `duty lint` and `duty test`.
  # Each id matches a name in PREK_SKIP of the precommit duty.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run duty ruff
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
        files: ^(.*\.py|pyproject\.toml|uv\.lock)$

      - id: format
        name: ruff format
        entry: uv run duty format
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
        files: ^(.*\.py|pyproject\.toml|uv\.lock)$

      - id: ty
        name: ty
        entry: uv run duty ty
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
        files: ^((src|tests)/.*\.py|pyproject\.toml|uv\.lock)$

      - id: typos
        name: typos
        entry: uv run duty typos
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]

      - id: actionlint
        name: actionlint
        entry: uv run duty actionlint
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
        files: ^\.github/

      - id: zizmor
        name: zizmor
        entry: uv run duty zizmor
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
        files: ^\.github/

      - id: pytest
        name: pytest
        entry: uv run duty test
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
        files: |
          (?x)^(
          src/|
          tests/|
          uv\.lock|
          pyproject\.toml
          )

