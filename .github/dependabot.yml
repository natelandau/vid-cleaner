---
version: 2

updates:
  # The composite actions under .github/actions/ pin their own actions, and the
  # root directory alone never scans them.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: scope
    # Wait a week so a compromised release is caught before it reaches this repo
    cooldown:
      default-days: 7
    groups:
      ci-deps:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    # Wait a week so a compromised release is caught before it reaches this repo
    cooldown:
      default-days: 7
    versioning-strategy: increase
    allow:
      - dependency-type: production
    groups:
      runtime-deps:
        patterns:
          - "*"
