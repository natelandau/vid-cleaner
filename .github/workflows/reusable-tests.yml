---
name: "Reusable Tests"

on:
    workflow_call:
        inputs:
            upload-coverage:
                description: "Upload the coverage report to Codecov"
                required: false
                type: boolean
                default: false
        secrets:
            CODECOV_TOKEN:
                required: false

permissions:
    contents: read

jobs:
    test-python-code:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            # Finish every Python version so one run shows which versions fail
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python, uv, and the package
              uses: ./.github/actions/setup_python_env
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run tests with coverage
              shell: bash
              run: uv run duty test

            - name: Upload coverage to Codecov
              if: ${{ inputs.upload-coverage }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: .cache/coverage.xml
                  flags: python-${{ matrix.python-version }}

    lint-project:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python, uv, and the package
              uses: ./.github/actions/setup_python_env

            - name: Run all linters
              shell: bash
              run: uv run duty lint
